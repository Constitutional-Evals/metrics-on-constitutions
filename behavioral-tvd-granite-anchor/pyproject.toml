[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constitution-distance"
version = "0.1.0"
description = "Probability-based behavioral distances between constitutions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["torch==2.6.0", "transformers==4.51.3", "accelerate==1.6.0", "huggingface-hub==0.30.2", "safetensors==0.5.3", "numpy==2.2.5"]

[project.scripts]
constitution-distance-local = "constitution_distance.local_cli:main"
constitution-distance = "constitution_distance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
